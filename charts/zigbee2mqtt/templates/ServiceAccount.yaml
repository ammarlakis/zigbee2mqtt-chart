{{- if .Values.zigbee2mqtt.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "zigbee2mqtt.serviceAccountName" . }}
  labels:
    {{- include "zigbee2mqtt.labels" . | nindent 4 }}
  {{- with .Values.zigbee2mqtt.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.zigbee2mqtt.serviceAccount.automount }}
{{- end }}
