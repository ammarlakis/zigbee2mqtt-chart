{{- if .Values.zigbee2mqtt.ingress.enabled }}
{{- if not .Values.zigbee2mqtt.ingress.hosts }}
{{- fail "zigbee2mqtt.ingress.hosts must contain at least one host when ingress is enabled" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "zigbee2mqtt.fullname" . }}
  labels:
    {{- include "zigbee2mqtt.labels" . | nindent 4 }}
  {{- with .Values.zigbee2mqtt.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.zigbee2mqtt.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    {{- range $host := .Values.zigbee2mqtt.ingress.hosts }}
    - host: {{ required "zigbee2mqtt.ingress.hosts[].host is required" $host.host | quote }}
      http:
        paths:
          {{- range $path := required "zigbee2mqtt.ingress.hosts[].paths must contain at least one path" $host.paths }}
          - path: {{ default "/" $path.path }}
            pathType: {{ default "Prefix" $path.pathType }}
            backend:
              service:
                name: {{ include "zigbee2mqtt.fullname" $ }}
                port:
                  number: {{ $.Values.zigbee2mqtt.service.port }}
          {{- end }}
    {{- end }}
  {{- with .Values.zigbee2mqtt.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
