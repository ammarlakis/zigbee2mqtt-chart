name: Release Charts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      chart_asset: ${{ steps.package.outputs.asset }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: Set up git-cliff
        uses: kenji-miyake/setup-git-cliff@2778609c643a39a2576c4bae2e493b855eb4aee8 # v2

      - name: Generate changelog
        id: changelog
        run: |
          printf 'changelog<<EOF\n' >> "$GITHUB_OUTPUT"
          git cliff -l >> "$GITHUB_OUTPUT"
          printf 'EOF\n' >> "$GITHUB_OUTPUT"

      - name: Package Helm chart
        id: package
        run: |
          mkdir -p dist
          helm package charts/zigbee2mqtt --destination dist
          file=$(ls dist/zigbee2mqtt-*.tgz)
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "asset=${file##*/}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload asset
        uses: softprops/action-gh-release@5be0e66d93ac7ed76da52eca8bb058f665c3a5fe # v2.4.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false
          files: ${{ steps.package.outputs.file }}
          make_latest: true

  update-registry:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: 2336325
          private-key: ${{ secrets.UPDATE_REGISTRY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Trigger registry update
        uses: the-actions-org/workflow-dispatch@3133c5d135c7dbe4be4f9793872b6ef331b53bc7 # v4
        with:
          repo: "ammarlakis/helm-charts"
          workflow: Add Chart to Helm Repository
          ref: "master"
          wait-for-completion: false
          inputs: |
            {
              "repository": "${{ github.repository }}",
              "release_name": "${{ github.ref_name }}",
              "chart_asset": "${{ needs.release.outputs.chart_asset }}"
            }
          token: ${{ steps.app-token.outputs.token }}
